<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 340" width="1260" height="340" role="img" aria-labelledby="t d">
  <title id="t">How AgentTrace works</title>
  <desc id="d">Four steps: you say the goal, a real browser does it, every step is verified and recorded, you get the answer, a report, proof and a reusable script. It stops before payment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#1a1f45"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9 z" fill="#7c8cf5"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="1256" height="336" rx="26" fill="url(#bg)" stroke="#2c3470" stroke-width="2"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="46" font-size="22" font-weight="700" fill="#f1f5ff">How it works</text>
    <text x="1220" y="46" font-size="16" fill="#8e99d6" text-anchor="end">one call in, one verified result out</text>

    <!-- arrows -->
    <g stroke="#7c8cf5" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arr)" fill="none">
      <line x1="294" y1="160" x2="342" y2="160"/>
      <line x1="604" y1="160" x2="652" y2="160"/>
      <line x1="914" y1="160" x2="962" y2="160"/>
    </g>

    <!-- card 1 -->
    <g transform="translate(40 76)">
      <rect width="250" height="168" rx="16" fill="#12183a" stroke="#3a4488" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="url(#num)"/>
      <text x="30" y="36" font-size="17" font-weight="800" fill="#0a0f1f" text-anchor="middle">1</text>
      <text x="56" y="37" font-size="20" font-weight="700" fill="#f1f5ff">Say the goal</text>
      <rect x="16" y="58" width="218" height="42" rx="8" fill="#0a0f1f"/>
      <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" fill="#67e8f9">
        <text x="26" y="75">pilot "find the price</text>
        <text x="26" y="92">of EX5" --url SITE</text>
      </g>
      <text x="20" y="128" font-size="15" fill="#aab4ec">English or Bangla,</text>
      <text x="20" y="148" font-size="15" fill="#aab4ec">no selectors needed</text>
    </g>

    <!-- card 2 -->
    <g transform="translate(350 76)">
      <rect width="250" height="168" rx="16" fill="#12183a" stroke="#3a4488" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="url(#num)"/>
      <text x="30" y="36" font-size="17" font-weight="800" fill="#0a0f1f" text-anchor="middle">2</text>
      <text x="56" y="37" font-size="20" font-weight="700" fill="#f1f5ff">A real browser acts</text>
      <text x="20" y="76" font-size="15" fill="#aab4ec">Chromium via Playwright</text>
      <text x="20" y="102" font-size="15" fill="#aab4ec">search, click, add to cart</text>
      <text x="20" y="128" font-size="15" fill="#aab4ec">saved login, no password</text>
      <text x="20" y="148" font-size="15" fill="#aab4ec">ever shared with the AI</text>
    </g>

    <!-- card 3 -->
    <g transform="translate(660 76)">
      <rect width="250" height="168" rx="16" fill="#12183a" stroke="#3a4488" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="url(#num)"/>
      <text x="30" y="36" font-size="17" font-weight="800" fill="#0a0f1f" text-anchor="middle">3</text>
      <text x="56" y="37" font-size="20" font-weight="700" fill="#f1f5ff">Every step is verified</text>
      <text x="20" y="76" font-size="15" fill="#aab4ec">every request saved to a HAR</text>
      <text x="20" y="102" font-size="15" fill="#aab4ec">checked against what the</text>
      <text x="20" y="122" font-size="15" fill="#aab4ec">page really shows</text>
      <text x="20" y="148" font-size="15" fill="#aab4ec">finds the API behind it</text>
    </g>

    <!-- card 4 -->
    <g transform="translate(970 76)">
      <rect width="250" height="168" rx="16" fill="#12261f" stroke="#2f7a5b" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="15" fill="#34d399"/>
      <text x="30" y="36" font-size="17" font-weight="800" fill="#0a0f1f" text-anchor="middle">4</text>
      <text x="56" y="37" font-size="20" font-weight="700" fill="#f1f5ff">You get</text>
      <text x="20" y="76" font-size="15" fill="#b6ecd3">the answer</text>
      <text x="20" y="102" font-size="15" fill="#b6ecd3">a short report</text>
      <text x="20" y="128" font-size="15" fill="#b6ecd3">screenshots + HAR as proof</text>
      <text x="20" y="154" font-size="15" fill="#b6ecd3">a reusable Playwright script</text>
    </g>

    <!-- safety strip -->
    <g transform="translate(40 266)">
      <rect width="1180" height="42" rx="21" fill="#12261f" stroke="#2f7a5b" stroke-width="1.5"/>
      <text x="590" y="27" font-size="16" fill="#6ee7b7" text-anchor="middle" font-weight="600">Stops at the payment page. Never pays, never bypasses CAPTCHA, login or robots.txt. It reports the real blocker instead.</text>
    </g>
  </g>
</svg>
